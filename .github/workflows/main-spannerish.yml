name: main - spannerish - Bygg, test og deploy

# Avviker fra sas-standarden ved at bygg, test og image ikke bruker de gjenbrukbare workflowene:
# frontenden må bygges med pnpm først, og det skjer i samme jobb som Gradle-bygget.

on:
  push:
    branches:
      - main
    paths:
      # Generelt oppsett - alt unntatt dokumentasjon / urelatert oppsett
      - '**'
      - '!**.md'
      - '!CODEOWNERS'
      - '!LICENSE'
      - '!docs/**'
      - '!deploy/**'
      - '!.github/dependabot.yml'
      - '!.github/workflows/standard-dependabot-auto-merge.yml'
      - '!.github/workflows/standard-dependency-submission.yml'
      # Ressursene som deployes av denne workflowen
      - 'deploy/spannerish.yml'
      # Spesielt for denne tjenesten ellers
      - '!.github/workflows/pr.yml'
      - '!.github/workflows/main-spanner.yml'
      - '!backend/**'
  schedule:
    - cron: '0 4 * * 3'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read # for sarif
  contents: read
  security-events: write # push sarif to github security
  id-token: write # for nais login

jobs:
  bygg-image:
    name: Bygg, test, og publiser image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # for sarif upload on private repos
      contents: read
      id-token: write # for nais login
      security-events: write # push sarif to github security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: pnpm run test
        run: pnpm run test
        working-directory: frontend

      # Frontenden bygges kun her, og pakkes inn i imaget som statiske ressurser.
      - name: pnpm run build
        run: pnpm run build
        working-directory: frontend

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: NAIS login
        id: login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: tbd

      - name: gradlew clean build :filbackend:jib
        id: jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean build :filbackend:jib --build-cache \
            -Pimage.registry='${{ steps.login.outputs.registry }}' \
            -Pimage.tag=$(date -u +%Y.%m.%d-%H.%M)-$(git rev-parse --short=12 HEAD) \
            -Djib.console=plain
          ref="$(cat filbackend/build/jib-image.name)@$(cat filbackend/build/jib-image.digest)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Generer SBOM, attester og signer
        uses: nais/attest-sign@61e94c81cec0784078969aefa8e136bf343cfd7d # v2.0.16
        with:
          image_ref: ${{ steps.jib.outputs.ref }}

      - name: Scan docker image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.jib.outputs.ref }}
          format: 'sarif'
          scanners: 'secret'
          output: 'trivy.sarif'

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: 'trivy.sarif'
    outputs:
      image_ref: ${{ steps.jib.outputs.ref }}

  deploy-dev:
    name: Deploy til dev
    needs: bygg-image
    uses: navikt/helse-sas-github-workflows/.github/workflows/deploy.yml@2f6844aa5e6852c64522681b3edb09c99445ad59 # v1.0.1
    with:
      CLUSTER: dev-gcp
      RESOURCE: deploy/spannerish.yml
      WORKLOAD_IMAGE: ${{ needs.bygg-image.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write # for nais login
