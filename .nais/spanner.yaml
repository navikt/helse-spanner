apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spanner
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    initialDelay: 10
    path: internal/isalive
  readiness:
    initialDelay: 10
    path: internal/isready
  replicas:
    cpuThresholdPercentage: 90
    max: 1
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  azure:
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /assets/**
    application:
      enabled: true
      claims:
        extra:
          - "NAVident"
      allowAllUsers: false
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: spleis-api
        - application: sparsom-api
        - application: spurtedu
        - application: speed-api
  env:
    - name: DEVELOPMENT
      value: "false"
    - name: HTTP_PORT
      value: "8080"
    - name: SPLEIS_API_URL
      value: http://spleis-api
    - name: SPARSOM_API_URL
      value: http://sparsom-api
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
